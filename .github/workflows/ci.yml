name: adversary-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q --cov=adversary --cov-report=term-missing

  redteam:
    name: red-team gate (demo agent)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      # This demonstrates the CI gate. The bundled demo agent is intentionally
      # vulnerable, so we run it in report-only mode (|| true) and upload the
      # HTML report as an artifact. Point --target at YOUR agent and drop the
      # '|| true' to make a landed HIGH+ attack actually fail the build.
      - name: Run adversary suite
        run: |
          adversary run \
            --target examples.vulnerable_agent.agent:build_target \
            --fail-at HIGH \
            --html report.html \
            --json report.json || true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: adversary-report
          path: |
            report.html
            report.json
